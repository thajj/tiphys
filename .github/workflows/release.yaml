name: Release image
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/thajj/argocanvas
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - name: Build local image for verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: argocanvas:release-verify
      - name: Verify restricted container
        run: |
          docker run -d --name gateway --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --tmpfs /data:uid=1000,gid=1000,mode=700 --tmpfs /tmp:uid=1000,gid=1000,mode=700 \
            -p 127.0.0.1:3000:3000 \
            -e PUBLIC_URL=https://builder.example -e ARGO_ENDPOINT=http://127.0.0.1:2746 \
            -e ARGO_NAMESPACE=workflows -e ARGO_TOKEN=ci-argo-token \
            -e AUTH_PROXY_SECRET=ci-proxy-secret-at-least-32-characters \
            argocanvas:release-verify
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:3000/healthz; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:3000/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/platform/config)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/readyz)" = 503
          docker stop --timeout 30 gateway
          test "$(docker inspect --format '{{.State.ExitCode}}' gateway)" = 0
      - name: Build and push multi-arch image
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/thajj/argocanvas
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true
