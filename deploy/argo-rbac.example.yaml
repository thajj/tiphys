# Apply separately to your actual workflow execution namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tiphys-client
  namespace: workflows
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tiphys-client
  namespace: workflows
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows, workflowtemplates]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tiphys-client
  namespace: workflows
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tiphys-client
subjects:
  - kind: ServiceAccount
    name: tiphys-client
    namespace: workflows
