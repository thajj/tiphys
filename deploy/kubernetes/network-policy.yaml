apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tiphys-ingress
spec:
  podSelector:
    matchLabels:
      app: tiphys
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
      ports:
        - { protocol: TCP, port: 4180 }
