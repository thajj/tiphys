name: Bug report
description: Report an issue or unexpected behavior in ArgoCanvas
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please ensure that any shared logs, manifests, or screenshots
        have been sanitized to remove authentication tokens, private URLs, personal data, or sensitive workflow content.
        Suspected security vulnerabilities should be reported privately via the **Security** tab.
  - type: input
    id: version
    attributes:
      label: Commit or release version
      description: The commit SHA or release version where you encountered the bug.
      placeholder: e.g. 0.1.0 or git commit SHA
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Deployment mode
      description: Which gateway or runtime mode was in use?
      options:
        - Development gateway (pnpm dev)
        - Production gateway (Docker container / Kubernetes)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment details
      description: Browser, OS, Node.js version, and cluster versions (Kubernetes / Argo Workflows) if applicable.
      placeholder: e.g. Chrome 132 / macOS 15.3 / Node 24.19 / Argo Workflows 4.1.6
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open the visual workflow builder
        2. Add a Container step with ...
        3. Click 'Submit'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually occurred? Include sanitized error messages or logs if available.
    validations:
      required: true
  - type: checkboxes
    id: sanitization
    attributes:
      label: Privacy and credential sanitization
      options:
        - label: I have verified that logs, manifests, and screenshots contain no real tokens, credentials, personal data, or sensitive workflow content.
          required: true
